apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: virbius-system
data:
  falco.yaml: |
    json_output: true
    json_include_output_property: true
    syscall_event_drops:
      actions:
        - log
      rate: 0.05
      max_burst: 10
      simulated_drops: 0
    syscall_event_timeouts:
      max_consecutives: 1000
    base_syscalls:
      repair: false
      setup:
        - close
        - mmap
        - munmap
        - getpid
        - gettid
        - getrandom
    rules_file:
      - /etc/falco/falco_rules.local.yaml
      - /etc/falco/falco_rules.d/*.yaml
    stdout_output:
      enabled: false
    file_output:
      enabled: false
    grpc:
      enabled: false
    webserver:
      enabled: true
      listen_port: 8765
      k8s_healthz_endpoint: /healthz
    http_output:
      enabled: true
      url: "http://virbius-engine.virbius-system.svc.cluster.local:8080/api/internal/falco-alert"
      user_agent: "falco/virbius"
      connection_keepalive: true
      retry_wait_seconds: 5

  falco_rules.local.yaml: |
    # All Virbius Falco rules are managed in the database and deployed
    # via falco_rules.d/ through the config_subscriber.
    # This file is intentionally empty — kept for future Virbius-specific
    # macro/list definitions if needed.
