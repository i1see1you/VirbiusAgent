apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: virbius-system
data:
  falco.yaml: |
    json_output: true
    json_include_output_property: true
    syscall_event_drops:
      actions:
        - log
      rate: 0.05
      max_burst: 10
      simulated_drops: 0
    syscall_event_timeouts:
      max_consecutives: 1000
    base_syscalls:
      repair: false
      setup:
        - close
        - mmap
        - munmap
        - getpid
        - gettid
        - getrandom
    stdout_output:
      enabled: false
    file_output:
      enabled: false
    grpc:
      enabled: false
    webserver:
      enabled: true
      listen_port: 8765
      k8s_healthz_endpoint: /healthz
    program_output:
      enabled: true
      keep_alive: false
      program: |
        virbius-kernel-falco-ingest

  falco_rules.local.yaml: |
    - rule: Agent process spawned
      desc: Detect new processes in Agent context
      condition: >
        spawned_process
        and not proc.name startswith "falco"
        and not proc.name startswith "virbius"
      output: >
        Agent process spawned (user=%user.name, command=%proc.cmdline, pid=%proc.pid)
      priority: WARNING
      tags: [agent, process]

    - rule: Agent network connection
      desc: Detect outbound connections from Agent
      condition: >
        outbound
        and not fd.sip in (trusted_ips)
      output: >
        Agent outbound connection (fd=%fd.name, pid=%proc.pid)
      priority: NOTICE
      tags: [agent, network]
