apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: virbius-system
  labels:
    app: falco
spec:
  selector:
    matchLabels:
      app: falco
  template:
    metadata:
      labels:
        app: falco
    spec:
      serviceAccountName: falco
      hostNetwork: true
      containers:
        - name: falco
          image: falcosecurity/falco:0.41.0
          securityContext:
            privileged: true
          volumeMounts:
            - name: falco-config
              mountPath: /etc/falco/falco_rules.local.yaml
              subPath: falco_rules.local.yaml
            - name: falco-config
              mountPath: /etc/falco/falco.yaml
              subPath: falco.yaml
            - name: falco-rules-d
              mountPath: /etc/falco/falco_rules.d
              readOnly: true
            - name: dev-fs
              mountPath: /dev
            - name: proc-fs
              mountPath: /host/proc
              readOnly: true
            - name: boot-fs
              mountPath: /host/boot
              readOnly: true
            - name: kernel-modules
              mountPath: /host/lib/modules
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: tracing
              mountPath: /sys/kernel/tracing
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: config-subscriber
          image: virbius-kernel-config-subscriber:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: VIRBIUS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: virbius-redis-credentials
                  key: url
                  optional: true
          volumeMounts:
            - name: falco-rules-d
              mountPath: /etc/falco/falco_rules.d
      volumes:
        - name: falco-config
          configMap:
            name: falco-config
        - name: falco-rules-d
          emptyDir: {}
        - name: dev-fs
          hostPath:
            path: /dev
        - name: proc-fs
          hostPath:
            path: /proc
        - name: boot-fs
          hostPath:
            path: /boot
        - name: kernel-modules
          hostPath:
            path: /lib/modules
        - name: btf
          hostPath:
            path: /sys/kernel/btf
        - name: tracing
          hostPath:
            path: /sys/kernel/tracing
