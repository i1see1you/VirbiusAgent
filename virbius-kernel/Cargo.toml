[package]
name = "virbius-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VirbiusAgent kernel layer: Falco deployment, mode detection, fallback"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
redis = { version = "1.4", features = ["tokio-comp"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
