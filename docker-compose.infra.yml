# MySQL 8 + Redis + Kafka + Ollama for host-side IDE launches (.vscode/launch.json).
# Advertised Kafka listener is localhost so Spring Boot on the host can connect.
# First start downloads VirbiusGuard GGUF (~484MB) and imports it into Ollama.
#
#   docker compose -p virbius-infra -f docker-compose.infra.yml up -d --wait
#   docker compose -p virbius-infra -f docker-compose.infra.yml down
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: virbius
      MYSQL_DATABASE: virbius
      MYSQL_USER: virbius
      MYSQL_PASSWORD: virbius
    volumes:
      - infra-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql_mode=NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pvirbius"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - infra-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: MkUjOEJhQjY1QUY1NDQ2Nk1BODI
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.11.10}
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - infra-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  ollama-download:
    image: ${CURL_IMAGE:-curlimages/curl:8.12.1}
    user: "0"
    environment:
      VIRBIUS_GUARD_GGUF_URL: ${VIRBIUS_GUARD_GGUF_URL:-https://huggingface.co/i1see1you/VirbiusGuard/resolve/main/virbiusguard-v13-q4_k_m.gguf}
      VIRBIUS_GUARD_GGUF_PATH: /models/model.gguf
    volumes:
      - infra-ollama-import:/models
      - ./deploy/ollama/download-gguf.sh:/download-gguf.sh:ro
    entrypoint: ["sh", "-c", "sh /download-gguf.sh && exec sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /models/model.gguf"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.11.10}
    environment:
      OLLAMA_HOST: http://ollama:11434
      VIRBIUS_OLLAMA_MODEL: ${VIRBIUS_PROMPT_LLM_MODEL:-virbiusguard}
      VIRBIUS_GUARD_GGUF_PATH: /models/model.gguf
    volumes:
      - infra-ollama-import:/models
      - ./deploy/ollama/import-model.sh:/import-model.sh:ro
    entrypoint: ["sh", "-c", "sh /import-model.sh && exec sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "ollama show $$VIRBIUS_OLLAMA_MODEL >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 60
      start_period: 20s
    depends_on:
      ollama:
        condition: service_healthy
      ollama-download:
        condition: service_healthy
    restart: unless-stopped

volumes:
  infra-mysql-data:
  infra-redis-data:
  infra-ollama-data:
  infra-ollama-import:
