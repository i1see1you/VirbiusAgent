[project]
name = "virbius-integrate"
version = "0.1.0"
description = "VirbiusAgent native-tool integration: observe, audit, inventory (advisory grade)."
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=0.2",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
