# =============================================================================
#  virbiusDemo — Docker Compose (独立部署单元)
#
#  virbius-demo is a SEPARATE deployment unit from the virbius-agent platform.
#  It joins the existing platform network (virbius-agent_default) and uses
#  service DNS: virbius-engine:8082 / virbius-control:8080.
#  Do NOT hairpin those through host.docker.internal — Docker Desktop injects
#  an IPv6 host.docker.internal that does not reach published host ports.
#
#  Prerequisites:
#    - The virbius-agent platform must be up FIRST
#      (docker compose -p virbius-agent up -d) so the external network exists.
#
#  Usage (from virbius-demo/):
#    docker compose build          # Build the demo image (uses repo-root context)
#    docker compose up -d          # Start the demo
#    docker compose ps             # Check status
#    docker compose logs -f        # Follow logs
#    docker compose down           # Stop the demo
# =============================================================================

name: virbius-demo

services:
  demo:
    build:
      # Build context MUST be the VirbiusAgent repo root (parent of virbius-demo),
      # because the multi-stage Dockerfile COPYs virbius-core/ sources.
      context: ..
      dockerfile: virbius-demo/Dockerfile
      # Build-time proxy: route apt/pip/cargo downloads through the host's local
      # proxy (eztzCore on 7890) to speed up image build. Reaches the host via
      # host.docker.internal (see extra_hosts below). Override with
      # DOCKER_BUILD_PROXY to disable or point elsewhere.
      args:
        http_proxy: ${DOCKER_BUILD_PROXY:-http://host.docker.internal:7890}
        https_proxy: ${DOCKER_BUILD_PROXY:-http://host.docker.internal:7890}
      extra_hosts:
        - "host.docker.internal:host-gateway"
    container_name: virbius-demo
    ports:
      - "8000:8000"                # Browser: http://localhost:8000
    env_file:
      # Inject API keys at runtime (see config.py's .env loader). The .env file is
      # excluded from the image via .dockerignore, so it can be rotated freely.
      - ./.env
    environment:
      PORT: "8000"
      # Same Docker network as the platform; IPv4 service DNS, no IPv6 hairpin.
      VIRBIUS_CONTROL_URL: http://virbius-control:8080
      VIRBIUS_ENGINE_URL: http://virbius-engine:8082
      VIRBIUS_UPSTREAM_URL: http://127.0.0.1:9091
      VIRBIUS_MCP_PROXY_BIN: /usr/local/bin/virbius-mcp-proxy
      VIRBIUS_EGRESS_HOSTS: wiki.internal,mail.internal
      # Runtime user settings persisted to the config volume (see §4 of the PRD).
      VIRBIUS_CONFIG_DIR: /data
      # Only domestic LLMs are used (DeepSeek etc.), reached directly; no external
      # LLM is supported, so the runtime proxy is unnecessary. Clear the build
      # proxy baked into the image from the runtime environment so every address
      # (internal services and domestic LLMs) connects directly.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      ALL_PROXY: ""
      all_proxy: ""
      # Reuse the host's Ollama for the demo's local small models.
      # Requires Ollama to be installed/serving on the host (localhost:11434).
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      # Host Ollama only. Platform traffic uses service DNS on virbius-agent_default.
      - "host.docker.internal:host-gateway"
    networks:
      - platform
    volumes:
      # Persist runtime user configuration (keys, platform addresses, etc.),
      # so it survives demo container rebuilds. See PRD §4.
      - demo-config:/data
      # Proxy timeout / engine_url 改 toml 后免重建镜像。
      - ./virbius-mcp-proxy.toml:/app/virbius-mcp-proxy.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  platform:
    name: virbius-agent_default
    external: true

volumes:
  demo-config: