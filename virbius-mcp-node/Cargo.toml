[package]
name = "virbius-mcp-node"
version.workspace = true
edition.workspace = true
description = "VirbiusAgent Node.js MCP bindings via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
virbius-core = { path = "../virbius-core" }
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
