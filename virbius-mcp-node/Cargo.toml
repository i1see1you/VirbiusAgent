[package]
name = "virbius-mcp-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VirbiusAgent Node.js MCP bindings via napi-rs"
repository = "https://github.com/i1see1you/VirbiusAgent"
homepage = "https://www.virbius.cn"

[lib]
crate-type = ["cdylib"]

[dependencies]
virbius-core = { path = "../virbius-core" }
napi = { version = "2", features = ["napi4"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
