# Node A — 管理面：virbius-control + virbius-auth
# 用法：scp 本文件与 .env 到 A 机同目录，`docker compose --env-file .env -f node-a-control.yml up -d`
# 依赖：客户 MySQL / Kafka / Redis 可达；A 机只需出站访问这三个服务。
name: virbius-onprem-a

services:
  virbius-auth:
    image: ${IMAGE_REGISTRY:-hb.grainmind.cn/library}/virbius-auth:${IMAGE_TAG:-v1.0.0}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8083"
      VIRBIUS_JDBC_URL: ${VIRBIUS_JDBC_URL:?set VIRBIUS_JDBC_URL}
      VIRBIUS_JDBC_USER: ${MYSQL_USER}
      VIRBIUS_JDBC_PASSWORD: ${MYSQL_PASSWORD}
      VIRBIUS_AUTH_DATA_DIR: /data
      # issuer 必须与 control 侧 VIRBIUS_AUTH_ISSUER 完全一致（JWT iss 校验）
      VIRBIUS_AUTH_ISSUER: http://127.0.0.1:8083
      VIRBIUS_AUTH_RETURN_URI: ${CONTROL_PUBLIC_URL}/ui/callback
      VIRBIUS_AUTH_RETURN_URI_TLS: ${CONTROL_PUBLIC_URL}/ui/callback
      VIRBIUS_AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-admin}
      VIRBIUS_AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:?set AUTH_BOOTSTRAP_PASSWORD}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - auth-data:/data
      # - ./certs:/certs:ro   # MYSQL sslMode=VERIFY_IDENTITY 时解开（手册 §6）
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-sf", "--noproxy", "*", "http://localhost:8083/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  virbius-control:
    image: ${IMAGE_REGISTRY:-hb.grainmind.cn/library}/virbius-control:${IMAGE_TAG:-v1.0.0}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # ── 客户 MySQL（与 auth 同库，独立 Flyway 历史表 auth_schema_history） ──
      VIRBIUS_JDBC_URL: ${VIRBIUS_JDBC_URL:?set VIRBIUS_JDBC_URL}
      VIRBIUS_JDBC_USER: ${MYSQL_USER}
      VIRBIUS_JDBC_PASSWORD: ${MYSQL_PASSWORD}
      # ── 客户 Kafka（SASL） ──
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:?set KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:?set KAFKA_SASL_PASSWORD}
      # ── 客户 Redis ──
      VIRBIUS_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      # ── 跨机指向 B 机引擎 ──
      VIRBIUS_ENGINE_URL: http://${NODE_B}:8082
      # ── 安全密钥（prod profile 启动强制校验） ──
      VIRBIUS_LICENSE_MASTER_KEY: ${VIRBIUS_LICENSE_MASTER_KEY:?set VIRBIUS_LICENSE_MASTER_KEY}
      VIRBIUS_API_KEY_PEPPER: ${VIRBIUS_API_KEY_PEPPER:?set VIRBIUS_API_KEY_PEPPER}
      VIRBIUS_DELEGATED_MASTER_KEY: ${VIRBIUS_DELEGATED_MASTER_KEY:-}
      VIRBIUS_AUDIT_EXPORT_KEY: ${VIRBIUS_AUDIT_EXPORT_KEY:-}
      # ── 运营台登录（auth 同机部署，回环直连） ──
      VIRBIUS_OPERATOR_JWT_ENABLED: "true"
      VIRBIUS_AUTH_JWKS_URL: http://127.0.0.1:8083/.well-known/jwks.json
      VIRBIUS_AUTH_ISSUER: http://127.0.0.1:8083
      VIRBIUS_AUTH_LOGIN_URL: ${CONTROL_PUBLIC_URL}/login
      VIRBIUS_AUTH_TOKEN_URL: http://127.0.0.1:8083/oauth/token
      # ── 本地文件态（edge manifest / 审计导出落本机磁盘；单副本即可） ──
      VIRBIUS_DATA_DIR: /data
      VIRBIUS_LOG_DIR: /var/log/virbius
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    volumes:
      - control-data:/data
      # - ./certs:/certs:ro   # MYSQL sslMode=VERIFY_IDENTITY 时解开（手册 §6）
      - control-logs:/var/log/virbius
    ports:
      - "8080:8080"
    depends_on:
      virbius-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "--noproxy", "*", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  auth-data:
  control-data:
  control-logs:
