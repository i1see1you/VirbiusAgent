{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "virbius.fullname" . }}-mysql
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "mysql") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "virbius.fullname" . }}-mysql
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  serviceName: {{ include "virbius.fullname" . }}-mysql
  replicas: 1
  selector:
    matchLabels:
      {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "mysql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "mysql") | nindent 8 }}
    spec:
      {{- include "virbius.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "virbius.secretName" . }}
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: virbius
            - name: MYSQL_USER
              value: virbius
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "virbius.secretName" . }}
                  key: mysql-password
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --sql_mode=NO_ENGINE_SUBSTITUTION
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -u root -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size }}
{{- end }}
