{{- if and (gt (int .Values.control.replicaCount) 1) (not .Values.control.sharedStorageEnabled) }}
{{- fail "control.replicaCount > 1 is unsafe with per-replica local storage: edge manifests and audit exports are written to /data (an RWO PVC), so replica A's writes are invisible to replica B (stale manifests after publish; exports fail to download from other replicas). Mount /data on shared NFS at the same absolute path on every replica (see DEPLOYMENT §8.5), then set control.sharedStorageEnabled=true to lift this guard." }}
{{- end }}
{{- if and (gt (int .Values.control.replicaCount) 1) (ne .Values.control.persistence.accessMode "ReadWriteMany") }}
{{- fail "control.replicaCount > 1 also requires control.persistence.accessMode=ReadWriteMany (and, if needed, storageClass pointing at an RWX/NFS class): a ReadWriteOnce volume cannot be mounted by two replicas, so the second control pod would stay Pending or attach stale local state. See DEPLOYMENT §8.5." }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "virbius.fullname" . }}-control-data
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  accessModes: ["{{ .Values.control.persistence.accessMode | default "ReadWriteOnce" }}"]
  {{- with .Values.control.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.control.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "virbius.fullname" . }}-control
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "control") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virbius.fullname" . }}-control
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  replicas: {{ .Values.control.replicaCount }}
  selector:
    matchLabels:
      {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "control") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "control") | nindent 8 }}
    spec:
      {{- include "virbius.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      # Soft host spread (same rationale as the engine): only meaningful once
      # replicaCount > 1; ScheduleAnyway keeps single-node clusters working.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "control") | nindent 14 }}
      initContainers:
        {{- if .Values.mysql.enabled }}
        {{- include "virbius.waitFor" (dict "root" . "name" "mysql" "host" (printf "%s-mysql" (include "virbius.fullname" .)) "port" 3306) | nindent 8 }}
        {{- end }}
        {{- if .Values.redis.enabled }}
        {{- include "virbius.waitFor" (dict "root" . "name" "redis" "host" (printf "%s-redis" (include "virbius.fullname" .)) "port" 6379) | nindent 8 }}
        {{- end }}
        {{- if .Values.kafka.enabled }}
        {{- include "virbius.waitFor" (dict "root" . "name" "kafka" "host" (printf "%s-kafka" (include "virbius.fullname" .)) "port" 9092) | nindent 8 }}
        {{- end }}
        {{- include "virbius.waitFor" (dict "root" . "name" "engine" "host" (printf "%s-engine" (include "virbius.fullname" .)) "port" 8082) | nindent 8 }}
        {{- if .Values.auth.enabled }}
        {{- include "virbius.waitFor" (dict "root" . "name" "auth" "host" (printf "%s-auth" (include "virbius.fullname" .)) "port" 8083) | nindent 8 }}
        {{- end }}
      containers:
        - name: control
          image: {{ include "virbius.image" (dict "root" . "component" "control") }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "8080"
            - name: VIRBIUS_JDBC_URL
              value: {{ include "virbius.jdbcUrl" . | quote }}
            - name: VIRBIUS_JDBC_USER
              value: virbius
            - name: VIRBIUS_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "virbius.secretName" . }}
                  key: mysql-password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "virbius.kafkaBootstrap" . | quote }}
            - name: VIRBIUS_REDIS_URL
              value: {{ include "virbius.redisUrl" . | quote }}
            - name: VIRBIUS_ENGINE_URL
              value: http://{{ include "virbius.fullname" . }}-engine:8082
            - name: VIRBIUS_LICENSE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "virbius.secretName" . }}
                  key: license-master-key
            - name: VIRBIUS_DELEGATED_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "virbius.secretName" . }}
                  key: delegated-master-key
            {{- if .Values.control.apiKeyEnabled }}
            - name: VIRBIUS_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "virbius.secretName" . }}
                  key: api-key-pepper
            {{- end }}
            - name: VIRBIUS_SECURITY_API_KEY_ENABLED
              value: {{ .Values.control.apiKeyEnabled | quote }}
            {{- include "virbius.kafkaSaslEnv" . | nindent 12 }}
            {{- if .Values.auth.enabled }}
            - name: VIRBIUS_OPERATOR_JWT_ENABLED
              value: "true"
            - name: VIRBIUS_AUTH_JWKS_URL
              value: {{ printf "%s/.well-known/jwks.json" (include "virbius.authInternalUrl" .) | quote }}
            - name: VIRBIUS_AUTH_ISSUER
              value: {{ include "virbius.authInternalUrl" . | quote }}
            - name: VIRBIUS_AUTH_LOGIN_URL
              value: {{ printf "%s/login" (include "virbius.controlPublicOrigin" .) | quote }}
            - name: VIRBIUS_AUTH_TOKEN_URL
              value: {{ printf "%s/oauth/token" (include "virbius.authInternalUrl" .) | quote }}
            {{- end }}
            - name: VIRBIUS_DATA_DIR
              value: /data
            - name: VIRBIUS_LOG_DIR
              value: /var/log/virbius
            {{- if .Values.control.auditAllowPath }}
            # Per-replica local path for the allow-audit log (logback rolling files
            # must not be shared over NFS); see DEPLOYMENT §8.5.
            - name: VIRBIUS_AUDIT_ALLOW_PATH
              value: {{ .Values.control.auditAllowPath | quote }}
            {{- end }}
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
            - name: NO_PROXY
              value: "*"
            - name: no_proxy
              value: "*"
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/log/virbius
            {{- if .Values.mysql.tls.enabled }}
            - name: mysql-ca
              mountPath: /certs
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "virbius.fullname" . }}-control-data
        - name: logs
          emptyDir: {}
        {{- if .Values.mysql.tls.enabled }}
        - name: mysql-ca
          secret:
            {{- if .Values.mysql.tls.existingSecret }}
            secretName: {{ .Values.mysql.tls.existingSecret }}
            {{- else }}
            secretName: {{ include "virbius.secretName" . }}
            {{- end }}
            items:
              - key: mysql-ca
                path: mysql-ca.pem
        {{- end }}
