{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "virbius.secretName" . }}
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
type: Opaque
stringData:
  mysql-root-password: {{ .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ .Values.secrets.mysqlPassword | quote }}
  license-master-key: {{ .Values.secrets.licenseMasterKey | quote }}
  delegated-master-key: {{ .Values.secrets.delegatedMasterKey | quote }}
  {{- if .Values.control.apiKeyEnabled }}
  api-key-pepper: {{ required "control.apiKeyEnabled=true: set secrets.apiKeyPepper (server-side HMAC pepper for tenant API keys)" .Values.secrets.apiKeyPepper | quote }}
  {{- end }}
  {{- if .Values.redis.authEnabled }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  {{- if .Values.kafka.saslEnabled }}
  kafka-sasl-username: {{ required "kafka.saslEnabled=true: set secrets.kafkaSaslUsername" .Values.secrets.kafkaSaslUsername | quote }}
  kafka-sasl-password: {{ required "kafka.saslEnabled=true: set secrets.kafkaSaslPassword" .Values.secrets.kafkaSaslPassword | quote }}
  {{- end }}
  {{- if .Values.mysql.tls.enabled }}
  mysql-server-cert: {{ required "mysql.tls.enabled=true: set mysql.tls.serverCert (PEM)" .Values.mysql.tls.serverCert | quote }}
  mysql-server-key: {{ required "mysql.tls.enabled=true: set mysql.tls.serverKey (PEM)" .Values.mysql.tls.serverKey | quote }}
  mysql-ca: {{ required "mysql.tls.enabled=true: set mysql.tls.caPem (CA PEM, mounted into control)" .Values.mysql.tls.caPem | quote }}
  {{- end }}
  deepseek-api-key: {{ .Values.secrets.deepseekApiKey | quote }}
  openrouter-api-key: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- if .Values.auth.enabled }}
  auth-bootstrap-password: {{ .Values.secrets.authBootstrapPassword | quote }}
  {{- end }}
{{- end }}
