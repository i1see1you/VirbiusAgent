apiVersion: v1
kind: Service
metadata:
  name: {{ include "virbius.fullname" . }}-mcp-proxy
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "proxy") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virbius.fullname" . }}-mcp-proxy
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "proxy") | nindent 8 }}
    spec:
      {{- include "virbius.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "virbius.waitFor" (dict "name" "control" "host" (printf "%s-control" (include "virbius.fullname" .)) "port" 8080) | nindent 8 }}
        {{- include "virbius.waitFor" (dict "name" "engine" "host" (printf "%s-engine" (include "virbius.fullname" .)) "port" 8082) | nindent 8 }}
      containers:
        - name: proxy
          image: {{ include "virbius.image" (dict "root" . "component" "mcp-proxy") }}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: VIRBIUS_TRANSPORT
              value: tcp://0.0.0.0:9090
            - name: VIRBIUS_CONTROL_URL
              value: http://{{ include "virbius.fullname" . }}-control:8080
            - name: VIRBIUS_ENGINE_URL
              value: http://{{ include "virbius.fullname" . }}-engine:8082
            - name: VIRBIUS_REDIS_URL
              value: redis://{{ include "virbius.fullname" . }}-redis:6379
            - name: VIRBIUS_UPSTREAM_URL
              value: {{ .Values.proxy.upstreamUrl | quote }}
            - name: VIRBIUS_LOG_DIR
              value: /var/log/virbius
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /var/log/virbius
      volumes:
        - name: logs
          emptyDir: {}
