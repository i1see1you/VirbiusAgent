apiVersion: v1
kind: Service
metadata:
  name: {{ include "virbius.fullname" . }}-mcp-proxy
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "proxy") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virbius.fullname" . }}-mcp-proxy
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "proxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "proxy") | nindent 8 }}
    spec:
      {{- include "virbius.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "virbius.waitFor" (dict "root" . "name" "control" "host" (printf "%s-control" (include "virbius.fullname" .)) "port" 8080) | nindent 8 }}
        {{- include "virbius.waitFor" (dict "root" . "name" "engine" "host" (printf "%s-engine" (include "virbius.fullname" .)) "port" 8082) | nindent 8 }}
      containers:
        - name: proxy
          image: {{ include "virbius.image" (dict "root" . "component" "mcp-proxy") }}
          ports:
            - name: http
              containerPort: 9090
          {{- if .Values.proxy.localExec.enabled }}
          securityContext:
            privileged: true
          {{- end }}
          env:
            - name: VIRBIUS_TRANSPORT
              value: tcp://0.0.0.0:9090
            - name: VIRBIUS_CONTROL_URL
              value: http://{{ include "virbius.fullname" . }}-control:8080
            - name: VIRBIUS_AUTH_CONTROL_URL
              value: http://{{ include "virbius.fullname" . }}-control:8080
            - name: VIRBIUS_ENGINE_URL
              value: http://{{ include "virbius.fullname" . }}-engine:8082
            - name: VIRBIUS_REDIS_URL
              value: {{ include "virbius.redisUrl" . | quote }}
            - name: VIRBIUS_UPSTREAM_URL
              value: {{ .Values.proxy.upstreamUrl | quote }}
            - name: VIRBIUS_LOG_DIR
              value: /var/log/virbius
            {{- if .Values.proxy.localExec.enabled }}
            - name: VIRBIUS_LOCAL_EXEC_MODE
              value: gvisor
            - name: VIRBIUS_RUNSC_PATH
              value: /opt/virbius/bin/runsc
            - name: VIRBIUS_GVISOR_ROOTFS
              value: /opt/virbius/rootfs
            - name: VIRBIUS_GVISOR_STATE_ROOT
              value: {{ .Values.proxy.localExec.stateRoot | quote }}
            - name: VIRBIUS_GVISOR_ENFORCE_CGROUPS
              value: {{ ternary "1" "0" .Values.proxy.localExec.enforceCgroups | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /var/log/virbius
            {{- if .Values.proxy.localExec.enabled }}
            - name: gvisor-runsc
              mountPath: /opt/virbius/bin/runsc
              readOnly: true
            - name: gvisor-bin
              mountPath: /opt/virbius/bin/gvisor-bin
              readOnly: true
            - name: gvisor-rootfs
              mountPath: /opt/virbius/rootfs
              readOnly: true
            - name: gvisor-state
              mountPath: {{ .Values.proxy.localExec.stateRoot | quote }}
            {{- if .Values.proxy.localExec.manifestHostPath }}
            - name: gvisor-manifest
              mountPath: /app/data/edge/default
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        {{- if .Values.proxy.localExec.enabled }}
        - name: gvisor-runsc
          hostPath:
            path: {{ .Values.proxy.localExec.runscHostPath | quote }}
            type: File
        - name: gvisor-bin
          hostPath:
            path: {{ .Values.proxy.localExec.gvisorBinHostPath | quote }}
            type: Directory
        - name: gvisor-rootfs
          hostPath:
            path: {{ .Values.proxy.localExec.rootfsHostPath | quote }}
            type: Directory
        - name: gvisor-state
          hostPath:
            path: {{ .Values.proxy.localExec.stateHostPath | quote }}
            type: DirectoryOrCreate
        {{- if .Values.proxy.localExec.manifestHostPath }}
        - name: gvisor-manifest
          hostPath:
            path: {{ .Values.proxy.localExec.manifestHostPath | quote }}
            type: Directory
        {{- end }}
        {{- end }}
