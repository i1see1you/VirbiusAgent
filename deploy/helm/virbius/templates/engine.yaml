apiVersion: v1
kind: Service
metadata:
  name: {{ include "virbius.fullname" . }}-engine
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: http
  selector:
    {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "engine") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virbius.fullname" . }}-engine
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicaCount }}
  selector:
    matchLabels:
      {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "engine") | nindent 8 }}
    spec:
      {{- include "virbius.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "virbius.waitFor" (dict "root" . "name" "kafka" "host" (printf "%s-kafka" (include "virbius.fullname" .)) "port" 9092) | nindent 8 }}
        {{- include "virbius.waitFor" (dict "root" . "name" "redis" "host" (printf "%s-redis" (include "virbius.fullname" .)) "port" 6379) | nindent 8 }}
      containers:
        - name: engine
          image: {{ include "virbius.image" (dict "root" . "component" "engine") }}
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "8082"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "virbius.fullname" . }}-kafka:9092
            - name: VIRBIUS_REDIS_URL
              value: redis://{{ include "virbius.fullname" . }}-redis:6379
            - name: VIRBIUS_CONTROL_BASE_URL
              value: http://{{ include "virbius.fullname" . }}-control:8080
            - name: VIRBIUS_PROMPT_LLM_BASE_URL
              value: {{ .Values.engine.promptLlm.baseUrl | quote }}
            - name: VIRBIUS_PROMPT_LLM_MODEL
              value: {{ .Values.engine.promptLlm.model | quote }}
            - name: VIRBIUS_LOG_DIR
              value: /var/log/virbius
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
            - name: NO_PROXY
              value: "*"
            - name: no_proxy
              value: "*"
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /var/log/virbius
      volumes:
        - name: logs
          emptyDir: {}
