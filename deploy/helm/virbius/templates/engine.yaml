apiVersion: v1
kind: Service
metadata:
  name: {{ include "virbius.fullname" . }}-engine
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: http
  selector:
    {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "engine") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "virbius.fullname" . }}-engine
  labels:
    {{- include "virbius.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicaCount }}
  selector:
    matchLabels:
      {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "engine") | nindent 8 }}
    spec:
      {{- include "virbius.imagePullSecrets" . | nindent 6 }}
      # Soft host spread: replicas land on different nodes when possible, while a
      # single-node cluster still schedules. Together with per-instance consumer
      # groups, one replica per node is what makes an engine scale-out actually HA.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "virbius.componentSelectorLabels" (dict "root" . "component" "engine") | nindent 14 }}
      {{- if or .Values.kafka.enabled .Values.redis.enabled .Values.ollama.enabled }}
      initContainers:
        {{- if .Values.kafka.enabled }}
        {{- include "virbius.waitFor" (dict "root" . "name" "kafka" "host" (printf "%s-kafka" (include "virbius.fullname" .)) "port" 9092) | nindent 8 }}
        {{- end }}
        {{- if .Values.redis.enabled }}
        {{- include "virbius.waitFor" (dict "root" . "name" "redis" "host" (printf "%s-redis" (include "virbius.fullname" .)) "port" 6379) | nindent 8 }}
        {{- end }}
        {{- if .Values.ollama.enabled }}
        {{- include "virbius.waitFor" (dict "root" . "name" "ollama" "host" (printf "%s-ollama" (include "virbius.fullname" .)) "port" 11434) | nindent 8 }}
        {{- include "virbius.waitForOllamaModel" (dict "root" . "host" (printf "%s-ollama" (include "virbius.fullname" .)) "model" (.Values.engine.promptLlm.model | default .Values.ollama.model)) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: engine
          image: {{ include "virbius.image" (dict "root" . "component" "engine") }}
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SERVER_PORT
              value: "8082"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "virbius.kafkaBootstrap" . | quote }}
            {{- include "virbius.kafkaSaslEnv" . | nindent 12 }}
            - name: VIRBIUS_REDIS_URL
              value: {{ include "virbius.redisUrl" . | quote }}
            # Unique per-pod instance id: drives per-instance Redis stream consumer
            # groups (engine-cache-*, engine-deploy-*) and the canary bucket. MUST
            # be unique per replica — a shared value would merge consumer groups
            # and split broadcast messages between replicas.
            - name: VIRBIUS_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VIRBIUS_CONTROL_BASE_URL
              value: http://{{ include "virbius.fullname" . }}-control:8080
            - name: VIRBIUS_PROMPT_LLM_BASE_URL
              value: {{ include "virbius.promptLlmBaseUrl" . | quote }}
            - name: VIRBIUS_PROMPT_LLM_MODEL
              value: {{ .Values.engine.promptLlm.model | default .Values.ollama.model | quote }}
            - name: VIRBIUS_LOG_DIR
              value: /var/log/virbius
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
            - name: NO_PROXY
              value: "*"
            - name: no_proxy
              value: "*"
          # Cold start (Redis connect + subscriber join + rule seeding) can outlast the
          # liveness initialDelay on a loaded cluster. The startup probe gates liveness
          # and readiness until /admin/health answers, so a slow start no longer
          # restart-loops the pod; readiness still gates traffic on /admin/ready.
          startupProbe:
            httpGet:
              path: /admin/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              # Gates on Redis reachability + cache-reload consumer group ready,
              # so a fresh replica does not serve with an unseeded rule cache.
              path: /admin/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /var/log/virbius
      volumes:
        - name: logs
          emptyDir: {}
