# Copy to values-prod.yaml (gitignored) and fill in real values.
#   cp deploy/helm/virbius/values.example.yaml deploy/helm/virbius/values-prod.yaml
#
# Then:
#   ./deploy/scripts/k8s-deploy.sh --registry registry.example.com/virbius --tag v0.1.0 \
#     --values deploy/helm/virbius/values-prod.yaml

fullnameOverride: virbius

global:
  imageRegistry: registry.example.com/virbius
  imageTag: v0.1.0
  imagePullSecrets:
    - name: registry-pull-secret

ingress:
  enabled: true
  className: nginx
  baseDomain: virbius.example.com
  tls:
    enabled: false
    secretName: virbius-tls
  hosts:
    range: range.virbius.example.com
    control: control.virbius.example.com
    engine: engine.virbius.example.com
    proxy: proxy.virbius.example.com

engine:
  promptLlm:
    baseUrl: ""   # empty + ollama.enabled → in-cluster Ollama; required if ollama.enabled=false
    model: virbiusguard   # /v1/memory/check; keep in sync with ollama.model

mysql:
  enabled: true
  # jdbcUrl: jdbc:mariadb://mysql.example:3306/virbius?...   # required if enabled=false
  # P0 TLS baseline (recommended for production):
  tls:
    enabled: true
    # Prefer a pre-created Secret (cert-manager etc.) with keys
    # mysql-server-cert / mysql-server-key / mysql-ca:
    existingSecret: ""
    # PEM material — only used when existingSecret is empty. Place real PEMs in
    # the gitignored values-prod.yaml, never in this example file.
    serverCert: ""
    serverKey: ""
    caPem: ""

redis:
  enabled: true
  # url: redis://:password@redis.example:6379   # required if enabled=false
  authEnabled: true   # Redis requires secrets.redisPassword

kafka:
  enabled: true
  # bootstrapServers: kafka.example:9092   # required if enabled=false
  saslEnabled: true    # SCRAM credentials: secrets.kafkaSaslUsername / kafkaSaslPassword

# virbius-auth is test-environment only; production integrates user SSO.
# For a prod-like deployment set auth.enabled: false and use operator JWT/SSO.
auth:
  enabled: true

ollama:
  enabled: true
  # China: set ggufUrl to the ModelScope resolve URL for gguf/virbiusguard-v2.0-f16.gguf
  ggufUrl: https://huggingface.co/i1see1you/VirbiusGuard/resolve/main/gguf/virbiusguard-v2.0-f16.gguf
  gpu:
    enabled: false

secrets:
  existingSecret: ""
  mysqlRootPassword: "change-me-root"
  mysqlPassword: "change-me-virbius"
  # >= 32 chars; strong random value. Required in every profile.
  licenseMasterKey: "change-me-license-master-key-0123456789abcdef"
  # >= 32 chars; delegated credential plane (separate from license). Optional.
  delegatedMasterKey: "change-me-delegated-master-key-0123456789abcdef"
  # >= 32 chars; HMAC pepper for tenant API keys (required: control.apiKeyEnabled=true).
  apiKeyPepper: "change-me-api-key-pepper-0123456789abcdef"
  # Redis password (required: redis.authEnabled=true).
  redisPassword: "change-me-redis-password"
  # Kafka SCRAM credentials (required: kafka.saslEnabled=true).
  kafkaSaslUsername: "virbius"
  kafkaSaslPassword: "change-me-kafka-password"
  # virbius-auth bootstrap (test environments only; empty = no bootstrap user).
  authBootstrapPassword: "change-me-ops-login"
  deepseekApiKey: "sk-REPLACE-ME"
  openrouterApiKey: ""
