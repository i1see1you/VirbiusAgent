fullnameOverride: virbius

global:
  imageRegistry: "hb.grainmind.cn/library"
  imageTag: latest
  imagePullSecrets: []
  waitImage: hb.grainmind.cn/library/busybox:1.36

ingress:
  enabled: true
  className: nginx
  baseDomain: virbius.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ""
  hosts:
    range: range.virbius.example.com
    control: control.virbius.example.com
    engine: engine.virbius.example.com
    proxy: proxy.virbius.example.com

mysql:
  enabled: true
  image: hb.grainmind.cn/library/mysql:8.0
  # Required when enabled=false (external MySQL).
  jdbcUrl: ""
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

redis:
  enabled: true
  image: hb.grainmind.cn/library/redis:7-alpine
  # Required when enabled=false (external Redis), e.g. redis://redis.example:6379
  url: ""
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kafka:
  enabled: true
  image: hb.grainmind.cn/library/kafka:3.7.0
  # Required when enabled=false (external Kafka), e.g. kafka.example:9092
  bootstrapServers: ""
  clusterId: MkUjOEJhQjY1QUY1NDQ2Nk1BODI
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

ollama:
  enabled: true
  image: hb.grainmind.cn/library/ollama:0.11.10
  curlImage: curlimages/curl:8.12.1
  model: virbiusguard
  # HuggingFace V13 Q4_K_M (~484MB). For China, switch to ModelScope:
  # https://www.modelscope.cn/models/i1see1you/VirbiusGuard/resolve/master/virbiusguard-v13-q4_k_m.gguf
  ggufUrl: https://huggingface.co/i1see1you/VirbiusGuard/resolve/main/virbiusguard-v13-q4_k_m.gguf
  persistence:
    size: 10Gi
    importSize: 2Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  gpu:
    enabled: false
    count: 1
    runtimeClassName: nvidia

control:
  replicaCount: 1
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  apiKeyEnabled: false

engine:
  replicaCount: 1
  grpc:
    port: 50051
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  promptLlm:
    # Empty + ollama.enabled uses in-cluster http://{release}-ollama:11434
    baseUrl: ""
    model: virbiusguard

proxy:
  replicaCount: 1
  upstreamUrl: http://virbius-demo:9091
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

demo:
  replicaCount: 1
  agentUseDocker: "0"
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

secrets:
  existingSecret: ""
  mysqlRootPassword: ""
  mysqlPassword: ""
  licenseMasterKey: ""
  deepseekApiKey: ""
  openrouterApiKey: ""
