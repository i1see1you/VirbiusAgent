fullnameOverride: virbius

global:
  imageRegistry: "hb.grainmind.cn/library"
  imageTag: latest
  imagePullSecrets: []
  waitImage: hb.grainmind.cn/library/busybox:1.36

ingress:
  enabled: true
  className: nginx
  baseDomain: virbius.example.com
  annotations: {}
  tls:
    enabled: false
    secretName: ""
  hosts:
    range: range.virbius.example.com
    control: control.virbius.example.com
    engine: engine.virbius.example.com
    proxy: proxy.virbius.example.com

mysql:
  enabled: true
  image: hb.grainmind.cn/library/mysql:8.0
  # Required when enabled=false (external MySQL).
  jdbcUrl: ""
  # P0 TLS baseline. When true, provide PEM material via values (plaintext in
  # your gitignored values file — prefer an existingSecret with keys
  # mysql-server-cert / mysql-server-key / mysql-ca for production) or a
  # cert-manager-issued secret referenced via mysql.tls.existingSecret.
  tls:
    enabled: false
    # Optional: name of a pre-created Secret holding the three keys above.
    # When set, the chart does not generate them from values.
    existingSecret: ""
    serverCert: ""
    serverKey: ""
    caPem: ""
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

redis:
  enabled: true
  image: hb.grainmind.cn/library/redis:7-alpine
  # Required when enabled=false (external Redis), e.g. redis://:pass@redis.example:6379
  url: ""
  # P0 baseline: require a password (secrets.redisPassword). With an
  # existingSecret + in-cluster Redis, set redis.url explicitly instead.
  authEnabled: true
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kafka:
  enabled: true
  image: hb.grainmind.cn/library/kafka:3.7.0
  # Required when enabled=false (external Kafka), e.g. kafka.example:9092
  bootstrapServers: ""
  clusterId: MkUjOEJhQjY1QUY1NDQ2Nk1BODI
  # P0 baseline: SASL/SCRAM-SHA-256 on the client listener (PLAINTEXT transport —
  # TLS is a P1 item; accepted risk documented in DEPLOYMENT.md).
  # Credentials come from secrets.kafkaSaslUsername / kafkaSaslPassword.
  saslEnabled: true
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

ollama:
  enabled: true
  image: hb.grainmind.cn/library/ollama:0.11.10
  curlImage: curlimages/curl:8.12.1
  # Ollama name after import. Engine /v1/memory/check uses engine.promptLlm.model (defaults to this).
  model: virbiusguard
  # HuggingFace V15 F16 (~1.5GB). For China, switch to ModelScope:
  # https://www.modelscope.cn/models/i1see1you/VirbiusGuard/resolve/master/gguf/virbiusguard-v2.0-f16.gguf
  ggufUrl: https://huggingface.co/i1see1you/VirbiusGuard/resolve/main/gguf/virbiusguard-v2.0-f16.gguf
  persistence:
    size: 10Gi
    importSize: 4Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  gpu:
    enabled: false
    count: 1
    runtimeClassName: nvidia

control:
  replicaCount: 1
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Edge SDK / demo 用 vrb_tk_ 拉 policy-version、manifest。运营台 JWT 开着时这项必须 true，否则带 Key 也 401。
  apiKeyEnabled: true

auth:
  enabled: true
  # SQLite + signing key on PVC — keep a single replica.
  bootstrapUsername: admin
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

engine:
  replicaCount: 1
  grpc:
    port: 50051
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  promptLlm:
    # Empty + ollama.enabled uses in-cluster http://{release}-ollama:11434
    baseUrl: ""
    # VIRBIUS_PROMPT_LLM_MODEL — /v1/memory/check. Keep in sync with ollama.model.
    model: virbiusguard

proxy:
  replicaCount: 1
  upstreamUrl: http://virbius-demo:9091
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

demo:
  replicaCount: 1
  agentUseDocker: "0"
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

secrets:
  existingSecret: ""
  mysqlRootPassword: ""
  mysqlPassword: ""
  licenseMasterKey: ""
  # Server-side HMAC pepper for tenant API keys (required when control.apiKeyEnabled).
  apiKeyPepper: ""
  # Redis password (required when redis.authEnabled and no existingSecret).
  redisPassword: ""
  # Kafka SCRAM credentials (required when kafka.saslEnabled and no existingSecret).
  kafkaSaslUsername: ""
  kafkaSaslPassword: ""
  deepseekApiKey: ""
  openrouterApiKey: ""
  # virbius-auth bootstrap (test environments only; production uses SSO).
  authBootstrapPassword: ""
