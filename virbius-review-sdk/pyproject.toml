[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virbius-review-sdk"
version = "1.0.0"
description = "Official VirbiusAgent review SDK: input/output review over the engine /v1/evaluate API with streaming sliding-window support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "VirbiusAgent" }]
keywords = ["guardrails", "llm", "security", "review"]
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
async = ["httpx>=0.24"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
