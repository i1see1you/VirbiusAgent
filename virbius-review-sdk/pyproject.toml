[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virbius-review-sdk"
version = "1.0.3"
description = "Official VirbiusAgent review SDK: input/output review over the engine /v1/evaluate API with streaming sliding-window support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "VirbiusAgent" }]
keywords = ["guardrails", "llm", "security", "review", "ai-agents", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25",
]

[project.urls]
Homepage = "https://www.virbius.tech"
Repository = "https://github.com/i1see1you/VirbiusAgent"
Documentation = "https://github.com/i1see1you/VirbiusAgent/blob/main/virbius-review-sdk/README.md"
Issues = "https://github.com/i1see1you/VirbiusAgent/issues"

[project.optional-dependencies]
async = ["httpx>=0.24"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
