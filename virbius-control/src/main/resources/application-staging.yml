spring:
  datasource:
    url: ${VIRBIUS_JDBC_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${VIRBIUS_JDBC_USER}
    password: ${VIRBIUS_JDBC_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

virbius:
  security:
    api-key:
      enabled: true

audit:
  publish:
    backend: kafka
    kafka:
      topic: virbius-audit-events
  ingest:
    enabled: true
    backend: kafka
    kafka:
      topic: virbius-audit-events

trace:
  ingest:
    enabled: true
    backend: kafka
    kafka:
      topic: virbius-trace-events
      group-id: virbius-trace-ingest
