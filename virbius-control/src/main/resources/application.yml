server:
  port: ${SERVER_PORT:8080}

logging:
  file:
    name: ${VIRBIUS_LOG_DIR:/tmp/virbius/logs}/control.log
  logback:
    rollingpolicy:
      max-file-size: ${VIRBIUS_LOG_MAX_FILE_SIZE:100MB}
      max-history: ${VIRBIUS_LOG_MAX_HISTORY_DAYS:30}

spring:
  application:
    name: virbius-control
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${VIRBIUS_UPLOAD_MAX_FILE_SIZE:20MB}    # 与引擎 virbius.file.max-bytes (20MB) 对齐
      max-request-size: ${VIRBIUS_UPLOAD_MAX_REQUEST_SIZE:25MB}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # SASL client config (ignored when KAFKA_SECURITY_PROTOCOL is PLAINTEXT/unset).
    # Template builds the JAAS line from the SCRAM credentials below.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";
    consumer:
      group-id: virbius-audit-ingest
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false

virbius:
  security:
    api-key:
      # Canonical env: VIRBIUS_SECURITY_API_KEY_ENABLED (VIRBIUS_API_KEY_ENABLED kept
      # as a deprecated alias for one release).
      enabled: ${VIRBIUS_SECURITY_API_KEY_ENABLED:${VIRBIUS_API_KEY_ENABLED:false}}
      pepper: ${VIRBIUS_API_KEY_PEPPER:}
    operator-jwt:
      enabled: ${VIRBIUS_OPERATOR_JWT_ENABLED:false}
      jwks-url: ${VIRBIUS_AUTH_JWKS_URL:http://127.0.0.1:8082/.well-known/jwks.json}
      issuer: ${VIRBIUS_AUTH_ISSUER:http://127.0.0.1:8082}
      audience: virbius-control
      login-url: ${VIRBIUS_AUTH_LOGIN_URL:http://127.0.0.1:8082/login}
      token-url: ${VIRBIUS_AUTH_TOKEN_URL:http://127.0.0.1:8082/oauth/token}
    # Empty = auto: strict for prod/staging profiles. Set VIRBIUS_STRICT_SECRETS=false
    # only for local, prod-profile-like dev environments.
    strict-secrets: ${VIRBIUS_STRICT_SECRETS:}
  license:
    master-key: ${VIRBIUS_LICENSE_MASTER_KEY:}
    # Dev-only escape hatch for legacy local databases with weak/denylisted keys.
    allow-insecure-dev-key: ${VIRBIUS_LICENSE_ALLOW_INSECURE_DEV_KEY:false}
  delegated:
    # Delegated credential plane (v2.5-min). Separate from the license master
    # key (domain separation); >= 32 bytes, fail-fast on use.
    master-key: ${VIRBIUS_DELEGATED_MASTER_KEY:}
  data-dir: ${VIRBIUS_DATA_DIR:./data}
  redis:
    url: ${VIRBIUS_REDIS_URL:redis://127.0.0.1:6379}
  engine:
    base-url: ${VIRBIUS_ENGINE_URL:http://127.0.0.1:8082}
  gateway:
    artifact:
      enabled: ${VIRBIUS_GATEWAY_ARTIFACT_ENABLED:true}
      local-fallback: ${VIRBIUS_GATEWAY_ARTIFACT_LOCAL_FALLBACK:false}
      storage: ${VIRBIUS_GATEWAY_ARTIFACT_STORAGE:redis}
      redis:
        blob-prefix: virbius:artifacts:gateway
        pointer-prefix: virbius:config:gateway
        ack-prefix: virbius:ack:gateway
        events-stream: virbius:config:events
        retain-revisions: 10
        ack-ttl-seconds: 86400
      oss:
        base-url: ${VIRBIUS_GATEWAY_OSS_BASE_URL:}
        public-base-url: ${VIRBIUS_GATEWAY_OSS_PUBLIC_BASE_URL:}
        access-key: ${VIRBIUS_GATEWAY_OSS_ACCESS_KEY:}
        secret-key: ${VIRBIUS_GATEWAY_OSS_SECRET_KEY:}
        authorization-header: ${VIRBIUS_GATEWAY_OSS_AUTH_HEADER:}
  lists:
    redis:
      enabled: true
      key-prefix: virbius:lists
      sweep-cron: "0 0 3 * * *"
  audit:
    allow-log-path: ${VIRBIUS_AUDIT_ALLOW_PATH:${virbius.data-dir}/audit-allow.jsonl}
    allow-log:
      max-file-size: ${VIRBIUS_AUDIT_ALLOW_MAX_FILE_SIZE:100MB}
      max-history: ${VIRBIUS_AUDIT_ALLOW_MAX_HISTORY_DAYS:30}
      total-size-cap: ${VIRBIUS_AUDIT_ALLOW_TOTAL_SIZE_CAP:5GB}

audit:
  publish:
    async: true
    queue-max: 2000
    flush-batch-size: 64
    flush-interval-ms: 100
    backend: kafka
    kafka:
      topic: virbius-audit-events
  ingest:
    enabled: true
    backend: kafka
    kafka:
      topic: virbius-audit-events
    poll-ms: 1000
    batch-size: 256
    consumer-group: virbius-audit-ingest

trace:
  ingest:
    enabled: true
    backend: kafka
    kafka:
      topic: virbius-trace-events
      group-id: virbius-trace-ingest
    poll-ms: 1000
    batch-size: 256
    consumer-group: virbius-trace-ingest

virbius.audit.hash-chain:
  enabled: ${VIRBIUS_AUDIT_HASH_CHAIN_ENABLED:true}
  verify-enabled: ${VIRBIUS_AUDIT_HASH_CHAIN_VERIFY_ENABLED:true}
  verify-interval-ms: ${VIRBIUS_AUDIT_HASH_CHAIN_VERIFY_INTERVAL:3600000}
  verify-batch-size: ${VIRBIUS_AUDIT_HASH_CHAIN_VERIFY_BATCH:10000}

rollout:
  metrics:
    rollup-ms: 60000
  ladder:
    poll-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: health,info
