spring:
  datasource:
    url: jdbc:sqlite:${virbius.data-dir:./data}/virbius-control.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

virbius:
  security:
    api-key:
      enabled: false

audit:
  publish:
    backend: kafka
    kafka:
      topic: virbius-audit-events
  ingest:
    enabled: true
    backend: kafka
    kafka:
      topic: virbius-audit-events

trace:
  ingest:
    enabled: true
    backend: kafka
    kafka:
      topic: virbius-trace-events
      group-id: virbius-trace-ingest

logging:
  level:
    io.virbius: DEBUG
