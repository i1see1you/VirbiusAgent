spring:
  # Required env: VIRBIUS_JDBC_URL, VIRBIUS_JDBC_USER, VIRBIUS_JDBC_PASSWORD, KAFKA_BOOTSTRAP_SERVERS
  datasource:
    url: ${VIRBIUS_JDBC_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${VIRBIUS_JDBC_USER}
    password: ${VIRBIUS_JDBC_PASSWORD}
    hikari:
      maximum-pool-size: 50
      connection-timeout: 3000
      leak-detection-threshold: 30000
      # MySQL/MariaDB sessions default to the server timezone; pin to UTC so
      # CURRENT_TIMESTAMP / NOW() match the ISO-UTC strings the app writes
      # (SQLite's CURRENT_TIMESTAMP/datetime('now') are already UTC).
      connection-init-sql: ${VIRBIUS_JDBC_INIT_SQL:SET time_zone = '+00:00'}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      properties:
        linger.ms: 10
    consumer:
      group-id: virbius-audit-ingest
      auto-offset-reset: earliest
      max-poll-records: 500

virbius:
  security:
    api-key:
      enabled: true
  audit:
    publish:
      backend: kafka
      kafka:
        topic: virbius-audit-events
    ingest:
      enabled: true
      backend: kafka
      kafka:
        topic: virbius-audit-events
  trace:
    ingest:
      enabled: true
      backend: kafka
      kafka:
        topic: virbius-trace-events
        group-id: virbius-trace-ingest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
