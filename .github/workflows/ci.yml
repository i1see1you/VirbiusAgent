name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --workspace --exclude virbius-mcp-python --exclude virbius-mcp-node

      - name: Test
        run: cargo test --workspace --exclude virbius-mcp-python --exclude virbius-mcp-node

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Test
        run: mvn test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: |
            virbius-expr/go.sum
            virbius-gateway/wasm/go.sum
            virbius-kernel/plugin/go.sum

      - name: Test virbius-expr
        working-directory: virbius-expr
        run: go test ./...
