name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday 00:00 UTC
    - cron: '0 0 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# CodeQL requires write permission to upload security alerts
permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CodeQL supports Java and Go natively.
        # Rust support is not yet GA — Rust security is covered by cargo-audit in ci.yml.
        language: [java-kotlin, go]

    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Security + code quality queries
          queries: security-extended

      - name: Set up JDK 17 (for Java autobuild)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up Go (for Go autobuild)
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
