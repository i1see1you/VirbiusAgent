[package]
name = "virbius-mcp-proxy"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"

[features]
# Test-only seam: lets the cross-process E2E harness drive the delegated hit
# branch against a plain local HTTP server (relaxes the https+443 gate). Never
# enabled in release builds.
test-harness = []

[dependencies]
virbius-core = { path = "../virbius-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
chrono = "0.4"
futures-util = "0.3"
url = "2"
axum = { version = "0.7", features = ["json"] }
tokio-stream = "0.1"
base64 = "0.22"
sha2 = "0.10"
rdkafka = { version = "0.37", features = ["tokio"] }
redis = { version = "0.25", features = ["tokio-comp"] }
aes-gcm = "0.10"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
