server:
  port: ${SERVER_PORT:8082}

logging:
  file:
    name: ${VIRBIUS_LOG_DIR:/tmp/virbius/logs}/engine.log
  logback:
    rollingpolicy:
      max-file-size: ${VIRBIUS_LOG_MAX_FILE_SIZE:100MB}
      max-history: ${VIRBIUS_LOG_MAX_HISTORY_DAYS:30}

spring:
  application:
    name: virbius-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

virbius:
  data-dir: ${VIRBIUS_DATA_DIR:./data}
  redis:
    url: ${VIRBIUS_REDIS_URL:redis://127.0.0.1:6379}
  lists:
    redis:
      match-cache-ttl-sec: 60
      match-cache-max-entries: 200000
  evaluate:
    rate-limit:
      enabled: true
      per-session-per-min: 60
      per-ip-per-min: 600
      # P0-min: agent-level backstop (verified subject). Kept well above the
      # session quota so multi-session agents are not throttled; override with
      # 0-width semantics via per-session only. Formula: ~ sessions x 60.
      per-agent-per-min: ${VIRBIUS_EVALUATE_RATE_LIMIT_PER_AGENT_PER_MIN:600}
      max-windows-per-trace: 64
    auth:
      # P0-min caller authentication. The only per-request credential is a
      # short-lived (aud=evaluate) token; the 825-day License JWT is exchanged
      # once at POST /api/v1/auth/evaluate-token and never sent per-request.
      enabled: ${VIRBIUS_EVALUATE_AUTH_ENABLED:true}
      # N1: config-baked trust anchor (control's platform public PEM file).
      # MUST load when auth is enabled -> the engine refuses to start otherwise.
      bootstrap-pem-file: ${VIRBIUS_EVALUATE_AUTH_BOOTSTRAP_PEM:}
      bootstrap-kid: ${VIRBIUS_EVALUATE_AUTH_BOOTSTRAP_KID:bootstrap}
      # Redis enrichment / revocation sources (published by control).
      issuer-redis-key: virbius:engine:issuers
      revocation-redis-key: virbius:engine:revocations
      revocation-channel: virbius:license:revoked
      boot-retry-seconds: 60
      verify-cache-ttl-seconds: 900
  challenge:
    ttl-seconds: ${VIRBIUS_CHALLENGE_TTL:600}
    token-ttl-seconds: ${VIRBIUS_CHALLENGE_TOKEN_TTL:600}
    exemption-ttl-seconds: ${VIRBIUS_CHALLENGE_EXEMPTION_TTL:600}
  audit:
    engine-path: ${VIRBIUS_ENGINE_AUDIT:/tmp/virbius/engine-audit.jsonl}
    engine-allow-path: ${VIRBIUS_ENGINE_AUDIT_ALLOW:/tmp/virbius/engine-audit-allow.jsonl}
    publish:
      async: true
      queue-max: 2000
      flush-batch-size: 64
      flush-interval-ms: 100
      backend: kafka
      kafka:
        topic: virbius-audit-events
  # Async rule-hit action delivery (webhook / kafka). At-most-once: no retries, no
  # outbox; failures are logged + metered (virbius.async_action{type,result}) and never
  # affect the evaluation outcome. Delivery runs on a dedicated bounded pool so slow
  # webhooks or a dead broker cannot starve the async rule-evaluation pool.
  # NOTE: the kafka topic must be pre-created when the broker forbids auto-creation.
  async-action:
    enabled: ${VIRBIUS_ASYNC_ACTION_ENABLED:true}
    delivery-threads: ${VIRBIUS_ASYNC_ACTION_DELIVERY_THREADS:2}
    delivery-queue-max: ${VIRBIUS_ASYNC_ACTION_DELIVERY_QUEUE_MAX:1000}
    # Per-field caps applied while rendering placeholders (keeps serialized JSON valid;
    # the serialized body itself is never truncated). {{content}} uses content-max-chars,
    # every other placeholder uses field-max-chars.
    content-max-chars: ${VIRBIUS_ASYNC_CONTENT_MAX_CHARS:2000}
    field-max-chars: ${VIRBIUS_ASYNC_FIELD_MAX_CHARS:500}
    webhook:
      timeout-ms: ${VIRBIUS_ASYNC_WEBHOOK_TIMEOUT_MS:5000}
      # Empty = allow all (self-hosted default). Comma-separated host[:port] list to
      # restrict outbound targets; redirects are never followed (HttpClient NEVER).
      allowed-hosts: ${VIRBIUS_ASYNC_WEBHOOK_ALLOWED_HOSTS:}
    kafka:
      topic: ${VIRBIUS_ASYNC_KAFKA_TOPIC:virbius-rule-actions}
      max-block-ms: ${VIRBIUS_ASYNC_KAFKA_MAX_BLOCK_MS:1000}
  prompt-llm:
    base-url: ${VIRBIUS_PROMPT_LLM_BASE_URL:http://127.0.0.1:11434}
    model: ${VIRBIUS_PROMPT_LLM_MODEL:i1see1you/virbiusguard:v2.0}
    api-path: /v1/chat/completions
    timeout-ms: ${VIRBIUS_PROMPT_LLM_TIMEOUT_MS:30000}
    fail-open: true
    im-start: "<|im_start|>"
    im-end: ""
    system-prompt: |
      You are a strict LLM input auditor. Classify the user input for safety.
      If unsafe or controversial, output strict JSON only with no extra text:
      {"hit_rule": true, "triggered_id": "<specific safety category>"}
      If safe:
      {"hit_rule": false, "triggered_id": "none"}
    category-rule-mapping:
      Violent: prompt-violent
      Non-violent Illegal Acts: prompt-illegal
      Sexual Content or Sexual Acts: prompt-sexual
      PII: prompt-pii
      Suicide & Self-Harm: prompt-self-harm
      Unethical Acts: prompt-unethical
      Politically Sensitive Topics: prompt-political
      Copyright Violation: prompt-copyright
      Jailbreak: prompt-jailbreak
      Agent Tool Misuse: prompt-agent
  prompt-judge:
    default-backend: neohorse-4b
    timeout-ms: ${VIRBIUS_PROMPT_JUDGE_TIMEOUT_MS:2000}
    max-rules-per-batch: 8
    backends:
      neohorse-4b:
        type: neohorse
        base-url: ${VIRBIUS_NEOHORSE_URL:http://127.0.0.1:8091}
        enabled: true
        license: Apache-2.0
        commercial-use: true
        model-version: NeoHorse-Jev-4B-Q4_K_M
        max-rules-per-batch: 1
      startlux-4b:
        type: startlux
        base-url: ${VIRBIUS_STARTLUX_URL:http://127.0.0.1:8090}
        enabled: false
        license: CC-BY-NC-4.0
        commercial-use: false
        model-version: StartLux-Decision-v1.1-4B-Instant
        max-rules-per-batch: 8
      laya-zh:
        type: laya
        base-url: ${VIRBIUS_LAYA_URL:http://127.0.0.1:8092}
        enabled: false
        license: unknown
        commercial-use: false
        experimental: true
        model-version: laya-mlx-zh
        max-rules-per-batch: 1
  guard-detect:
    injection-enabled: ${VIRBIUS_INJECTION_DETECT_ENABLED:true}
    taint-enabled: ${VIRBIUS_TAINT_DETECT_ENABLED:true}
    # Guard categories whose tool-return hits are treated as indirect injection
    # and blocked (the rest, e.g. PII, are allowed; PII is DLP/masking's job).
    taint-block-categories: ${VIRBIUS_TAINT_BLOCK_CATEGORIES:Jailbreak,Agent Tool Misuse}
    # Input-gate injection categories that do NOT block. User-provided PII is
    # legitimate (DLP/masking's job) and agent-tool-misuse is only meaningful
    # once a tool call exists; judging it on raw user input over-refuses benign
    # agent tasks. Symmetric in shape with taint-block-categories, but an
    # exclude list so any unknown/new category still fails safe (blocks).
    injection-exclude-categories: ${VIRBIUS_INJECTION_EXCLUDE_CATEGORIES:PII,Agent Tool Misuse}
    timeout-ms: ${VIRBIUS_GUARD_LLM_TIMEOUT_MS:5000}
    fail-open: true
    taint-min-content-length: 512
    taint-max-content-length: 8192
    injection-system-prompt: |
      You are a strict LLM input auditor. Classify the user input for safety.
      If unsafe or controversial, output strict JSON only with no extra text:
      {"hit_rule": true, "triggered_id": "<specific safety category>"}
      If safe:
      {"hit_rule": false, "triggered_id": "none"}
    taint-system-prompt: |
      You are a strict LLM input auditor. Classify the user input for safety.
      If unsafe or controversial, output strict JSON only with no extra text:
      {"hit_rule": true, "triggered_id": "<specific safety category>"}
      If safe:
      {"hit_rule": false, "triggered_id": "none"}

  file:
    enabled: ${VIRBIUS_FILE_GUARD_ENABLED:true}
    max-bytes: 20971520                    # 单文件 ≤20MB
    max-files-per-request: 5
    max-pdf-pages: 50
    extract-max-chars: 8000                # 提取文本防御性硬截断(控检测 LLM token)
    chunk-size: 3500                       # 分块检测: 单块字符数
    chunk-overlap: 400                     # 分块检测: 相邻块重叠(防跨边界绕过)
    max-chunks: 32                         # 分块检测: 单文件最大块数, 超出发 FILE_TRUNCATED
    max-embedded-images-per-file: 10       # 文档内嵌图片送检上限, 超出发 FILE_EMBEDDED_LIMIT
    min-embedded-image-dim: 64             # 内嵌图片最小宽/高(px), 过滤 icon 装饰图
    ocr-model: ${VIRBIUS_OCR_MODEL:ovisocr2}
    ocr-base-url: ${VIRBIUS_PROMPT_LLM_BASE_URL:http://127.0.0.1:11434}
    ocr-timeout-ms: 30000
    ocr-breaker-failure-rate: 0.5          # 熔断: 滑动窗口失败率阈值
    ocr-breaker-wait-ms: 45000             # 熔断: OPEN 后半开探测等待
    ocr-cache-max-entries: 1000            # OCR 结果缓存(按内容 SHA-256)
    ocr-cache-ttl-minutes: 60
    attachment-workers: 3                  # 附件并行检测线程数
    attachment-timeout-ms: 12000           # 单附件检测预算, 超时发 FILE_OCR_TIMEOUT
    image-blacklist-enabled: ${VIRBIUS_IMG_BLACKLIST_ENABLED:true}
    blacklist-refresh-seconds: 60          # 黑名单快照从 Redis 刷新间隔

  session-risk:
    enabled: ${VIRBIUS_SESSION_RISK_ENABLED:true}
    base-risk-ratio: 0.1                   # base_risk = risk_quota × ratio
    injection-weight: 15                   # per-injection-hit risk delta
    falco-weight: 10                       # per-falco-alert risk delta
    decay-half-life-minutes: 30            # exp(-elapsed / half_life)
    decay-cutoff-minutes: 120              # event-driven dims → 0 after this
    intent-weight:                         # chain_anomaly weight by intent_action
      block: 0.5                           # confirmed malicious → 50% accumulation
      challenge: 0.1                       # suspicious, unconfirmed → 10% accumulation
      review: 0.0                          # advisory only → no accumulation
      allow: 0.0                           # rule allowed → no accumulation
    threshold:
      disconnect: 80                       # >80: force disconnect + alert
      full-audit: 60                       # >60: exit fast path + full audit
      sample-audit: 30                     # >30: audit sampling 50%
    session-ttl-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        # Actuator stays health-only by default: the engine Ingress routes only
        # `/v1` to the app port, so this endpoint set is not on the public host.
        # The prod profile opts in (health,prometheus) for in-cluster scraping;
        # staging drills should scrape via a private management port (1.1).
        include: health
