[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "virbius-mcp-python"
dynamic = ["version"]
description = "VirbiusAgent edge enforcement primitives for Python (PyO3 binding of virbius-core)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
]
# 运行时零第三方依赖（纯扩展模块）

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
manifest-path = "Cargo.toml"
# Mixed Rust/Python package: the PyO3 extension ships as the `_native`
# submodule and `python/virbius_mcp_python/__init__.py` re-exports it, so
# pure-Python helpers (guard.py: VirbiusGuard + framework decorators) can live
# in the same importable package.
module-name = "virbius_mcp_python._native"
python-source = "python"
features = ["pyo3/extension-module"]
