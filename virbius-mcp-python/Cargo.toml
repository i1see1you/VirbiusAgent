[package]
name = "virbius-mcp-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VirbiusAgent Python MCP bindings via PyO3"
repository = "https://github.com/i1see1you/VirbiusAgent"
homepage = "https://www.virbius.cn"

[lib]
name = "virbius_mcp_python"
crate-type = ["cdylib"]

[dependencies]
virbius-core = { path = "../virbius-core" }
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1"
