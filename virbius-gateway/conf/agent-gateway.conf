# Agent MCP Gateway - OpenResty configuration
# Auto-generated by virbius-compiler (P0: manual template)

upstream mcp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream virbius_engine {
    server 127.0.0.1:8082;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name agent-gateway.internal;

    # SSL config (provided by deployment)
    ssl_certificate     /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    # Access log with tool call tracing
    access_log /var/log/nginx/agent-access.log main;
    
    # Virbius gateway effective config path (set by compiler)
    set $virbius_effective /etc/virbius-gateway/effective.json;

    # MCP tool call endpoints
    location ~ ^/mcp/(?<app_id>[^/]+)/tools/call$ {
        access_by_lua_block {
            require("virbius-gateway").access()
        }
        proxy_pass http://mcp_backend/tools/call;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Virbius-App-Id $app_id;
        proxy_set_header X-Virbius-Trace-Id $upstream_http_x_virbius_trace_id;
    }

    # Generic tools/call (single app)
    location /tools/call {
        access_by_lua_block {
            require("virbius-gateway").access()
        }
        proxy_pass http://mcp_backend/tools/call;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SSE streaming for MCP
    location /sse {
        proxy_pass http://mcp_backend/sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
    }
}
